<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Stats</title>
<meta name="description" content="All-time GitHub statistics, updated automatically.">
<style>
  :root {
    --bg: #070707; --card: #121212; --line: #242424; --text: #fff; --mute: #8b8b8b; --dim: #5c5c5c; --track: #2a2a2a; --bar: #2f3340;
    --green: #34f5a0; --purple: #b794ff; --blue: #38bdf8; --pink: #ff5c9a; --yellow: #fbbf24;
    color-scheme: dark;
  }
  @font-face { font-family: 'Space Grotesk'; font-weight: 400 700; font-display: swap; src: url(assets/space-grotesk.woff2) format('woff2'); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 40px; }
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
  .c2 { grid-column: span 2; } .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; }
  .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c9 { grid-column: span 9; } .c12 { grid-column: span 12; }

  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--green); box-shadow: 0 0 14px #34f5a055; background: #0f1f18; object-fit: cover; }
  .who b { display: block; font-size: 19px; }
  .who span { font-size: 12px; color: var(--dim); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .btn { font-size: 12.5px; padding: 8px 16px; border-radius: 999px; border: 1px solid #2c2c2c; background: #151515; color: #ddd; transition: border-color .15s, color .15s, transform .15s; }
  .btn:hover { border-color: var(--green); color: #fff; transform: translateY(-1px); }
  .btn.primary { background: var(--green); border-color: var(--green); color: #04120b; font-weight: 700; }
  .btn.primary:hover { color: #04120b; filter: brightness(1.08); }
  .pills { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 4px; text-align: center; background: #151515; border: 1px solid #2c2c2c; border-radius: 999px; padding: 7px 14px; font-size: 12px; color: #9a9a9a; }
  .pill b { color: #fff; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; position: relative; min-width: 0; transition: border-color .2s, transform .2s; }
  .card:hover { border-color: #3a3a3a; }
  .t { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--c, var(--mute)); margin-bottom: 12px; }
  .t .r { margin-left: auto; font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 11px; text-align: right; color: var(--mute); }
  .hero2 { font-size: 40px; font-weight: 800; line-height: 1; margin-right: 18px; }
  .big { font-size: 28px; font-weight: 700; line-height: 1.1; }
  .sub { font-size: 12px; color: var(--mute); }
  .row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .hero { font-size: clamp(48px, 9vw, 68px); font-weight: 800; line-height: 1; margin: 10px 0 8px; font-variant-numeric: tabular-nums; }
  .split { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; font-size: 12px; color: var(--mute); }
  .split b { color: #fff; font-size: 19px; }
  .grow { color: var(--green); } .shrink { color: var(--pink); }

  .track { height: 7px; border-radius: 4px; background: var(--track); margin-top: 12px; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 4px; background: var(--c); transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }
  .in .fill { width: var(--w); }

  .heat { display: grid; grid-template-columns: repeat(53, minmax(0, 1fr)); gap: 3px; }
  .heat i { aspect-ratio: 1; border-radius: 2px; background: #1d211f; transition: transform .1s; }
  .heat i:hover { transform: scale(1.5); position: relative; z-index: 2; }
  .l1 { background: #0e4f35 !important; } .l2 { background: #12804f !important; } .l3 { background: #1fb870 !important; }
  .l4 { background: var(--green) !important; }
  .months { display: grid; grid-template-columns: repeat(53, minmax(0, 1fr)); gap: 3px; margin-top: 6px; font-size: 10px; color: var(--dim); }
  .months span { white-space: nowrap; }
  .legend { display: flex; align-items: center; gap: 3px; font-size: 10px; color: var(--mute); } .legend i { width: 9px; height: 9px; border-radius: 2px; display: block; background: #1d211f; } .legend span { margin: 0 4px; }
  .stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
  .stats4 b { display: block; font-size: 17px; } .stats4 small { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); font-weight: 700; }

  .seg { display: flex; gap: 4px; height: 13px; margin: 6px 0 14px; }
  .seg i { display: block; border-radius: 7px; min-width: 6px; transform-origin: left; transform: scaleX(0); transition: transform 1s cubic-bezier(.2, .8, .2, 1); }
  .in .seg i { transform: scaleX(1); }
  .legend2 { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 12px; color: var(--mute); }
  .legend2 b { color: #fff; font-weight: 600; } .legend2 em { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; font-style: normal; }
  .note { font-size: 10.5px; color: var(--dim); margin-top: 14px; }

  .cols { display: flex; align-items: flex-end; gap: 6px; height: 120px; margin-top: 22px; }
  .v { font-size: 11.5px; color: var(--mute); text-align: center; line-height: 16px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .cols.thin .v { font-size: 9px; font-weight: 500; }
  .months span { display: flex; flex-direction: column; gap: 1px; } .months small { font-size: 9.5px; color: var(--text); font-weight: 600; }
  .peakv { color: var(--text); }
  .tall { grid-row: span 2; }
  .achhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .achby { margin-left: 4px; font-size: 11px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #6a6a6a; }
  .achcnt { color: var(--mute); font-size: 13px; } .achcnt b { color: #fff; }
  .achgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 6px; margin-top: 12px; }
  .ac { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid #262626; border-radius: 14px; background: #141414; }
  .ac.leg { border-color: #ffd34e55; }
  .ac svg { flex: none; } .ac .ab { flex: 1; min-width: 0; }
  .ac .an { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .ac .an i { font-style: normal; font-size: 11.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .ac .bar { height: 6px; border-radius: 3px; background: #242424; margin: 7px 0 5px; overflow: hidden; } .ac .bar > div { height: 100%; border-radius: 3px; }
  .ac .as { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--mute); }
  .ac.lock .an span { color: #9a9a9a; }
  .achmore { margin-top: 12px; text-align: center; }
  .achgroup { margin: 16px 0 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #777; font-weight: 700; }
  .mix { margin-top: 22px; display: grid; gap: 14px; }
  .mixh { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--mute); }
  .mixh em { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  .mixh b { color: #fff; font-variant-numeric: tabular-nums; }
  .mix .track { margin-top: 6px; }
  .years { display: flex; justify-content: flex-end; margin: -2px 0 10px; }
  .tog { display: inline-flex; gap: 2px; background: #1a1a1a; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .tog button { font: inherit; font-size: 11px; color: var(--mute); background: none; border: 0; border-radius: 999px; padding: 3px 11px; cursor: pointer; }
  .tog button.on { background: var(--blue); color: #04121a; font-weight: 700; }
  .cols .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; gap: 1.5px; min-width: 0; }
  .cols .col > i { display: block; border-radius: 3px; height: 0; transition: height 1s cubic-bezier(.2, .8, .2, 1); }
  .in .cols .col > i { height: var(--h); }
  .cols .col:hover { filter: brightness(1.25); }
  .axis { display: flex; gap: 6px; margin-top: 7px; font-size: 10px; color: var(--dim); } .axis span { flex: 1; text-align: center; }
  .cols.thin { gap: 3px; } .axis.thin { gap: 3px; }
  .peak { background: var(--c) !important; }
  .gray { background: var(--bar); }
  .mini { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--mute); } .mini i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }

  .repo { display: grid; grid-template-columns: 130px 1fr 44px; align-items: center; gap: 12px; font-size: 13px; margin: 14px 0; }
  .repo .track { margin: 0; } .repo span:last-child { text-align: right; color: var(--mute); font-size: 12px; }
  .repo span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  footer { margin-top: 18px; text-align: right; font-size: 11px; color: var(--dim); }
  #tip { position: fixed; pointer-events: none; z-index: 10; background: #1c1c1c; border: 1px solid #383838; border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: 0 6px 20px #000a; opacity: 0; transition: opacity .1s; white-space: nowrap; }
  #err { text-align: center; color: var(--mute); padding: 80px 0; }

  @media (max-width: 760px) {
    .tall { grid-row: auto; }
    .cols.thin .v { display: none; } .hero { font-size: 52px; }
    .c2 { grid-column: span 6; } .c3, .c4, .c5, .c6, .c7, .c8, .c9 { grid-column: span 12; }
    .c4.half { grid-column: span 6; }
    .pills { margin-left: 0; } .repo { grid-template-columns: 100px 1fr 40px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* Achievements-Kachel an die übrigen Kacheln angleichen (achievements-ui.js wird von der Action bei jedem Lauf neu geschrieben, darum hier) */
  #achCard .ach-root { font-family: inherit; }
  #achCard .ach-dot { display: none !important; }
  #achCard .ach-title { color: var(--c); letter-spacing: 1.4px; }

  /* Theme & look: schmale Leiste, klappt bei Bedarf auf */
  .tlcard { padding: 12px 18px !important; }
  .tl .bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 34px; }
  .tl .bar .t { margin: 0; }
  .tl .sum { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .tl .sum span { font-size: 12px; color: #cfcfcf; border: 1px solid #2a2a2a; border-radius: 999px; padding: 3px 10px; background: #151515; }
  .tl .st { font-size: 12px; color: var(--mute); }
  .tl .bar .btn { font: inherit; font-size: 12.5px; padding: 7px 14px; cursor: pointer; }
  .tl .body { display: none; grid-template-columns: 1.15fr 1fr 1.25fr; gap: 28px; margin-top: 14px; padding-top: 4px; border-top: 1px solid #232323; }
  .tl.open .body { display: grid; }
  .tl .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: var(--dim); margin: 14px 0 10px; }
  .tl .ov { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tl .ov button { background: #141414; border: 1px solid #2c2c2c; border-radius: 12px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #cfcfcf; font: inherit; font-size: 12.5px; cursor: pointer; transition: border-color .15s, box-shadow .15s, color .15s; }
  .tl .ov button:hover { border-color: #444; }
  .tl .ov button .ic { height: 30px; display: grid; place-items: center; }
  .tl .ov button.on { border-color: var(--ac); color: #fff; box-shadow: 0 0 0 1px var(--ac), 0 0 14px color-mix(in srgb, var(--ac) 40%, transparent); }
  .tl .hint { font-size: 11.5px; color: var(--dim); margin-top: 8px; }
  .tl .rings { display: flex; flex-wrap: wrap; gap: 6px; }
  .tl .rings button { background: #141414; border: 1px solid #2c2c2c; border-radius: 999px; padding: 7px 15px; color: #cfcfcf; font: inherit; font-size: 12.5px; cursor: pointer; transition: border-color .15s, color .15s; }
  .tl .rings button:hover { border-color: #444; }
  .tl .rings button.on { border-color: var(--green); color: #fff; background: color-mix(in srgb, var(--green) 9%, #141414); }
  .tl .drow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 13px; color: #ddd; transition: opacity .15s; }
  .tl .drow.off { opacity: .35; pointer-events: none; }
  .tl .dens { display: flex; align-items: center; gap: 12px; flex: 1; justify-content: flex-end; }
  .tl .dens span { color: var(--mute); font-size: 12px; }
  .tl input[type=range] { -webkit-appearance: none; appearance: none; width: min(170px, 55%); height: 6px; border-radius: 6px; margin: 0; outline: none; cursor: pointer; background: linear-gradient(90deg, #ff9f5a var(--p), #2a2a2a var(--p)); }
  .tl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 10px rgba(255, 159, 90, .7); }
  .tl input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 10px rgba(255, 159, 90, .7); }
  .tl .sw { position: relative; width: 42px; height: 24px; flex: none; border-radius: 999px; border: 1px solid #2c2c2c; background: #1b1b1b; cursor: pointer; padding: 0; transition: background .15s, border-color .15s; }
  .tl .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #555; transition: left .15s, background .15s; }
  .tl .sw.on { background: color-mix(in srgb, var(--green) 22%, #0f0f0f); border-color: var(--green); }
  .tl .sw.on::after { left: 21px; background: var(--green); }
  .tl .pv { position: relative; height: 124px; margin-top: 14px; border: 1px solid #2a2a2a; border-radius: 12px; background: #0d0d0d; overflow: hidden; }
  .tl .pv .edge { position: absolute; left: -1px; right: -1px; bottom: -1px; height: 38px; border: 1px solid #2c2c2c; border-radius: 12px 12px 0 0; background: #151515; }
  .tl .pv .it { position: absolute; top: 0; left: 0; }
  .tl .pv svg { display: block; }
  .tl .pv .fl { animation: pvFall linear infinite; }
  .tl .pv .sway { animation: pvSway ease-in-out infinite alternate; }
  .tl .pv .pile { position: absolute; bottom: 35px; left: 0; right: 0; height: 20px; }
  .tl .pv .pile span { position: absolute; bottom: 0; }
  .tl .pv .pile i { display: block; }
  .tl .pv .pile .gust { animation: pvGust 10s ease-in infinite; }
  .tl .pv .bf { animation: pvBf ease-in-out infinite; }
  .tl .pv .flap { animation: pvFlap .18s linear infinite alternate; }
  .tl .pv .none { position: absolute; inset: 0 0 38px; display: grid; place-items: center; font-size: 12px; color: var(--dim); }
  @keyframes pvFall { from { transform: translate(var(--x0), -34px); opacity: 0 } 8% { opacity: 1 } 88% { opacity: 1 } to { transform: translate(var(--x1), var(--y1)); opacity: 0 } }
  @keyframes pvSway { from { transform: translateX(-7px) rotate(-35deg) } to { transform: translateX(7px) rotate(35deg) } }
  @keyframes pvGust { 0%, 76% { transform: none; opacity: 1 } 88% { transform: translate(170px, -34px) rotate(50deg); opacity: 0 } 89% { transform: none; opacity: 0 } 100% { opacity: 1 } }
  @keyframes pvBf { 0% { transform: translate(var(--x0), 14px) } 30% { transform: translate(var(--xl), 62px) } 62% { transform: translate(var(--xl), 62px) } 80% { transform: translate(calc(var(--xl) + 60px), 6px) } 100% { transform: translate(var(--x1), 20px) } }
  @keyframes pvFlap { from { transform: scaleX(1) } to { transform: scaleX(.3) } }
  @media (prefers-reduced-motion: reduce) { .tl .pv.rm * { animation-play-state: paused !important; } }
  .tl .xtra { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 28px; border-top: 1px solid #232323; }
  .tl .xtra:empty { display: none; }
  .tl .xtra .lbl { color: var(--ac); }
  .tl .cs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .tl .cs { gap: 8px; }
  .tl .cs button { position: relative; width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .18); padding: 0; cursor: pointer; opacity: .55; transition: transform .12s, opacity .12s, box-shadow .12s; }
  .tl .cs button:hover { opacity: .9; }
  .tl .cs button.on { opacity: 1; transform: scale(1.18); border-color: #fff; box-shadow: 0 0 0 3px #0f0f0f, 0 0 0 5px var(--ac), 0 0 14px var(--ac); }
  .tl .cs button.on::after { content: '✓'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #111; text-shadow: 0 0 3px rgba(255, 255, 255, .8); }
  .tl .cs input[type=color] { width: 26px; height: 26px; padding: 0; border: 2px dashed rgba(255, 255, 255, .3); border-radius: 50%; background: none; cursor: pointer; opacity: .55; }
  .tl .cs input[type=color].on { opacity: 1; border: 2px solid #fff; box-shadow: 0 0 0 3px #0f0f0f, 0 0 0 5px var(--ac), 0 0 14px var(--ac); }
  .tl .hx { font-style: normal; font-size: 11px; color: var(--mute); margin-left: 6px; letter-spacing: .5px; }
  .tl .pv svg.x { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .tl .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .tl .acts .btn { font: inherit; font-size: 13.5px; padding: 10px 20px; cursor: pointer; }
  .tl .msg { font-size: 12px; color: var(--mute); margin-top: 8px; min-height: 1em; }
  .tl .foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--dim); margin-top: 10px; }
  .tl .foot button { background: none; border: 0; color: var(--mute); font: inherit; cursor: pointer; padding: 0; }
  .tl .foot button:hover { color: #fff; }
  @media (max-width: 900px) { .tl .body { grid-template-columns: 1fr; gap: 6px; } .tl .sum { order: 3; flex-basis: 100%; } }
</style>

<body>
<main id="app"><div id="err">Loading stats…</div></main>
<div id="tip"></div>
<script>
const COL = { green: '#34f5a0', purple: '#b794ff', blue: '#38bdf8', pink: '#ff5c9a', yellow: '#fbbf24' };
const fmt = (n) => Math.round(n).toLocaleString('de-DE');
const short = (n) => (n >= 1e6 ? (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M' : n >= 1000 ? Math.round(n / 1000) + 'k' : String(Math.round(n)));
const tokShort = (n) => (n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n)));
const vivid = (hex) => { const n = parseInt(hex.slice(1), 16); return 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255) < 90 ? '#8b949e' : hex; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const card = (cls, title, color, right, body, hint = '') =>
  `<section class="card ${cls}" style="--c:${COL[color]}"${hint ? ` data-tip="${esc(hint)}"` : ''}><div class="t">${esc(title)}${right ? `<span class="r">${right}</span>` : ''}</div>${body}</section>`;
const tip = (s) => `data-tip="${esc(s)}"`;

function streaks(weeks) {
  const days = weeks.flat();
  let longest = 0, run = 0, best = 0, active = 0;
  for (const d of days) { if (d.count > 0) { run++; active++; longest = Math.max(longest, run); best = Math.max(best, d.count); } else run = 0; }
  let current = 0;
  for (let i = days.length - 1; i >= 0; i--) { if (days[i].count > 0) current++; else if (i === days.length - 1) continue; else break; }
  return { current, longest, active, best };
}

function heatBlock(weeks, skipFirst = true) {
  const st = streaks(weeks);
  const max = Math.max(1, ...weeks.flat().map((x) => x.count));
  let cells = '', months = '', lastM = -1;
  const monthSum = {};
  weeks.flat().forEach((x) => { monthSum[x.date.slice(0, 7)] = (monthSum[x.date.slice(0, 7)] || 0) + x.count; });
  weeks.forEach((w, wi) => {
    w.forEach((day) => {
      const dow = new Date(day.date + 'T00:00:00Z').getUTCDay();
      const l = day.count === 0 ? 0 : Math.min(4, Math.ceil((day.count / max) * 4));
      const label = new Date(day.date + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
      cells += `<i class="l${l}" style="grid-column:${wi + 1};grid-row:${dow + 1}" ${tip(`${day.count} contribution${day.count === 1 ? '' : 's'} · ${label}`)}></i>`;
    });
    const m = new Date(w[0].date + 'T00:00:00Z').getUTCMonth();
    if (m !== lastM) {
      if (lastM !== -1 || !skipFirst) months += `<span style="grid-column:${wi + 1} / span 4">${new Date(Date.UTC(2000, m, 1)).toLocaleString('en', { month: 'short' })}<small>${fmt(monthSum[w[0].date.slice(0, 7)] || 0)}</small></span>`;
      lastM = m;
    }
  });
  const cols = `grid-template-columns:repeat(${weeks.length}, minmax(0, 1fr))`;
  const html = `<div class="heat" style="${cols}">${cells}</div><div class="months" style="${cols}">${months}</div>
       <div class="stats4"><div><b style="color:var(--yellow)">${st.current} days</b><small>Current streak</small></div><div><b>${st.longest} days</b><small>Longest streak</small></div><div><b>${st.active} days</b><small>Active days</small></div><div><b>${st.best}</b><small>Best day</small></div></div>`;
  return { html, total: weeks.flat().reduce((sum, x) => sum + x.count, 0) };
}

function render(d) {

        const h = (sec) => Math.floor(sec / 3600) + 'h ' + String(Math.round((sec % 3600) / 60)).padStart(2, '0') + 'm';
        box.innerHTML = '<div class="cols" style="--c:var(--blue)">' + k.daily.map((x, i) => '<div class="col" data-tip="' + x.date + ': ' + h(x.sec) + '"><b class="v' + (i === dpk && dmax ? ' peakv' : '') + '">' + (x.sec ? (x.sec / 3600).toFixed(1) + 'h' : '–') + '</b><i class="' + (i === dpk && dmax ? 'peak' : 'gray') + '" style="--h:' + Math.max(6, dmax ? (x.sec / dmax) * 100 : 0) + '%"></i></div>').join('') + '</div><div class="axis thin">' + k.daily.map((x) => '<span>' + Number(x.date.slice(8)) + '</span>').join('') + '</div>';

    });
  }

  loadAchievements();

  // Animationen: Balken einblenden, Hauptzahl hochzählen
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('in')));
  const hero = document.getElementById('hero'), target = Number(hero.dataset.n), t0 = performance.now();

// Achievements: gleiche Oberfläche wie die Seite der Action (achievements-ui.js + achievements.json)
function loadAchievements() {
  const box = document.getElementById('achCard');
  fetch('achievements.json?' + Date.now(), { cache: 'no-store' }).then((r) => { if (!r.ok) throw 0; return r.json(); }).then((j) => {
    const get = (f) => fetch(f + '?' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    return Promise.all([get('road.json'), get('road-state.json')]).then(([road, roadState]) => ({ j, road, roadState }));
  }).then(({ j, road, roadState }) => {
    const sc = document.createElement('script');
    sc.src = 'achievements-ui.js?' + encodeURIComponent(j.updated);
    sc.onload = () => {
      // startet mit Highlights; #achievements=tree bzw. #achievements=road öffnet direkt die jeweilige Ansicht

}

// Veraltete Seite erkennen: GitHub Pages erlaubt 10 Minuten Browser-Cache für index.html. Weicht der Stand auf dem Server ab, einmal neu laden.
function checkPageVersion() {
  fetch(location.pathname, { cache: 'no-store', method: 'HEAD' }).then((r) => {
    const lm = r.headers.get('last-modified'); if (!lm || !document.lastModified) return;
    if (new Date(lm).getTime() - new Date(document.lastModified).getTime() > 1000) {
      let n = 0; try { n = +sessionStorage.getItem('pgReload') || 0; sessionStorage.setItem('pgReload', n + 1); } catch {}
      if (n < 2) location.reload();
    }
  }).catch(() => {});
}

// Neue Daten erkennen: beim Zurückkehren auf den Tab und alle 10 Minuten nachsehen, bei neuem Stand neu laden
function watchForUpdates(loaded) {
  const check = () => fetch('stats.json?' + Date.now(), { cache: 'no-store' })
    .then((r) => r.json())
    .then((j) => { if (String(j.updated) !== String(loaded)) location.reload(); })
    .catch(() => {});
  setInterval(check, 10 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
}

// Solange hier nichts eingetragen ist, gilt der alte Weg (einmal mit #settings öffnen, merkt sich der Browser).
const AUTH = { clientId: '', worker: '' };

  ls('cfgTok', null); ls('cfgRepo', null); // früher hier gespeicherter Token wird entfernt
  const host = location.hostname, owner = host.endsWith('.github.io') ? host.split('.')[0] : '';

    else if (b.dataset.ov) cfg.overlays = OV.map((o) => o[0]).filter((o) => (o === b.dataset.ov ? !has(o) : has(o)));
    else if (b.dataset.ring) cfg.ring = b.dataset.ring;
    else if (b.dataset.k) cfg[b.dataset.k] = !cfg[b.dataset.k];
    else if (b.dataset.xt || b.dataset.c) {
      const host = b.dataset.xt ? b : b.closest('.cs'), t = THEMES.find((x) => x.id === host.dataset.xt), c = t.controls[+host.dataset.xi];
      opts(t)[c.key] = b.dataset.c ? b.dataset.c : !opts(t)[c.key];
    }
    else return;
    if (b.id !== 'tlOpen') msg('');
    paint();
  });
  sec.addEventListener('input', (e) => {
    const el = e.target, host = el.dataset.xt ? el : el.closest('.cs'); if (!host || !host.dataset.xt) return;
    const t = THEMES.find((x) => x.id === host.dataset.xt), c = t.controls[+host.dataset.xi];
    opts(t)[c.key] = c.type === 'range' ? (c.scale ? +el.value / c.scale : +el.value) : el.value;
    msg(''); paint();
  });
  $('tlD').addEventListener('input', (e) => { cfg.density = +e.target.value; paint(); });
  $('cCopy').onclick = () => navigator.clipboard.writeText(json()).then(() => msg('Copied. Paste it into theme.json and commit.'), () => msg('Copy failed', 1));

  // Prüft theme.json, bis die Seite die neuen Einstellungen ausliefert (Workflow + Pages brauchen 1–3 Minuten)
  const loadTheme = () => fetch('theme.json?' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null));
  $('cSave').onclick = () => {
    if (!repo) return msg('Repository not detected on this host, use Copy JSON instead.', 1);
    const want = json();
    const body = 'Theme settings from the dashboard. Click **Create** to apply them, the workflow then rebuilds stats.svg and closes this issue.\n\n```json\n' + want + '```\n';
    window.open(`https://github.com/${repo}/issues/new?title=${encodeURIComponent('theme: update')}&body=${encodeURIComponent(body)}`, '_blank', 'noopener');
    msg('GitHub opened in a new tab. Click "Create" there; the change is applied within a few minutes.');
    clearInterval(poll);
    const t0 = Date.now();
    poll = setInterval(() => loadTheme().then((j) => {
      if (j && JSON.stringify(norm(j), null, 2) + '\n' === want) { clearInterval(poll); poll = null; saved = want; msg('Applied. stats.svg is being rebuilt.'); paint(); }
      else if (Date.now() - t0 > 10 * 60e3) { clearInterval(poll); poll = null; msg('Not applied yet. Check the issue on GitHub.', 1); paint(); }
    }).catch(() => {}), 15000);
    paint();
  };
  loadTheme().then((j) => { if (j) { cfg = norm(j); saved = json(); } }).catch(() => {}).finally(paint);
}

fetch('stats.json?' + Date.now(), { cache: 'no-store' })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((d) => { render(d); themeConfig(); watchForUpdates(d.updated); checkPageVersion(); })
  .catch((e) => { document.getElementById('err').textContent = 'Could not load stats.json (' + e.message + ')'; });
</script>
</body>
</html>
