# Smallest setup: stats card + achievements, updated every hour.
# Save as .github/workflows/stats.yml in your profile repo (<you>/<you>).
name: Update stats
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nkunze2306/github-achievements-by-niounze@v7
        with:
          token: ${{ secrets.STATS_TOKEN }}
          components: stats,achievements
          commit: 'true'
