name: Achievements
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: achievements
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nkunze2306/github-achievements-by-niounze@v1
        with:
          token: ${{ secrets.STATS_TOKEN }}
          wakatime-key: ${{ secrets.WAKATIME_API_KEY }} # optional
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add achievements.svg achievements-all.svg achievements.json .achievements-state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: update achievements" && git pull --rebase && git push)
