name: Apply theme

# "Save & rebuild" on the website opens a prefilled issue titled "theme: ...".
# Only issues of the repo owner are applied: commit theme.json, rebuild the stats, close the issue.
# Issues of everybody else are closed without changes. This way the website needs no token.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: apply-theme
  cancel-in-progress: false

jobs:
  reject:
    if: startsWith(github.event.issue.title, 'theme:') && github.event.issue.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Close without changes
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue close "$NUM" -R "$GITHUB_REPOSITORY" --reason "not planned" --comment "Only the owner can change the theme of this dashboard."

  apply:
    if: startsWith(github.event.issue.title, 'theme:') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write theme.json
        id: write
        uses: nkunze2306/github-achievements-by-niounze/apply-theme@v9
        with:
          issue-body: ${{ github.event.issue.body }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme.json
          git diff --cached --quiet || (git commit -m "chore: update theme" && git pull --rebase && git push)
      # Pushes with the default token do not start workflows, a workflow_dispatch does
      - name: Rebuild stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stats.yml -R "$GITHUB_REPOSITORY" --ref main
      - name: Close issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          OK: ${{ job.status == 'success' }}
          THEME: ${{ steps.write.outputs.theme }}
        run: |
          if [ "$OK" = "true" ]; then
            gh issue close "$NUM" -R "$GITHUB_REPOSITORY" --comment "Applied: \`$THEME\`. stats.svg is being rebuilt now."
          else
            gh issue close "$NUM" -R "$GITHUB_REPOSITORY" --reason "not planned" --comment "Could not apply these settings, see the workflow log."
          fi
